<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Iftekhar Anam">
        <meta name="descsription" content="HTML Tables">
        <!-- add stylesheet -->
        <link rel="stylesheet" href="styles/table-style.css">
        <title>HTML Tables</title>
    </head>

    <body>
        <main>
            <h1>HTML Tables</h1>
            <p>This webpage shows use of HTML tables.</p>
            <!-- Create a table  -->
            <table>
                <!-- Caption  -->
                 <caption>Our Team!</caption>
                <!-- Create the first row -->
                 <tr>
                 <th>Person</th>   
                 <th>Age</th>
                 </tr>
                <tr>
                    <td>Chris</td>
                    <td>38</td>
                 </tr>
                 <tr>
                    <td>Dennis</td>
                    <td>45</td>
                 </tr>
                 <tr>
                    <td>Sarah</td>
                    <td>29</td>
                 </tr>
                 <tr>
                    <td>Karen</td>
                    <td>47</td>
                 </tr>                                                   

            </table>

            <section>
                <h2>Video Embedding example</h2>
                <video src="https://www.youtube.com/watch?v=3082En6dEVI" controls
                width="500"
                height="500">
                    <p><a href="https://www.youtube.com/watch?v=3082En6dEVI"> Link to the video</a></p>
                </video>
            </section>
        </main>
    </body>

</html>
